# Example deployment behind Nginx Proxy Manager (NPM). Copy to docker-compose.yml and adjust.
#
# In NPM, add a Proxy Host for subscriberr.mediaservers.org → http://subscriberr:3000
# (Block common exploits on, SSL certificate + Force SSL + HTTP/2 on).

services:
  subscriberr:
    image: subscriberr:latest
    build: .
    container_name: subscriberr
    restart: unless-stopped
    # --- Container hardening: a compromised app must not be able to reach the host. ---
    # No privilege escalation through setuid binaries.
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability, then add back only what the entrypoint needs to fix the
    # ownership of the two volumes and switch to PUID:PGID. The app itself runs with none.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    # The image is immutable at runtime; only the two volumes and /tmp are writable.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    # Bounds for a runaway or abused process.
    pids_limit: 256
    mem_limit: 1g
    # NEVER mount /var/run/docker.sock, use `privileged: true` or `network_mode: host` here.
    environment:
      BASE_URL: https://subscriberr.mediaservers.org
      TRUST_PROXY: "true"
      GOOGLE_CLIENT_ID: "" # from Google Cloud Console
      GOOGLE_CLIENT_SECRET: ""
      # REQUIRED, >= 32 chars. Keep a copy in your password manager: backups do NOT include it.
      APP_SECRET: ""
      TZ: America/Toronto
      PUID: "99"
      PGID: "100"
      # Recommended: only these Google accounts can become the Owner of a fresh install.
      ADMIN_EMAILS: "" # e.g. "you@gmail.com"
    volumes:
      # Database, custom template packs, logos, import staging.
      - /mnt/user/appdata/subscriberr:/data
      # REQUIRED: backups. Must be a DIFFERENT share/disk than /data (not the same cache SSD).
      - /mnt/user/backups/subscriberr:/backups
    networks:
      - npm
    # No published port: NPM reaches the container over the shared network.
    # For a quick local test without NPM, uncomment (bound to this machine only — publishing it
    # on all interfaces would bypass NPM's TLS and let clients spoof X-Forwarded-For):
    # ports:
    #   - "127.0.0.1:3000:3000"

networks:
  npm:
    # The user-defined Docker network your Nginx Proxy Manager container is attached to.
    external: true
    name: npm_default
