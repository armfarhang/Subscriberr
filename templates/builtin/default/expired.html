<h1>Your access has been paused</h1>
<p>Hi {{member.display_name}}, we haven't received a payment since your due date of <strong>{{due_date}}</strong>, so your library access is paused for now.</p>
<table role="presentation" class="facts" cellpadding="0" cellspacing="0" border="0">
  <tr><td class="label">Amount</td><td class="value">{{amount_expected}}</td></tr>
  <tr><td class="label">Was due</td><td class="value warn">{{due_date}}</td></tr>
</table>
<p>As soon as your payment arrives, access is restored automatically.</p>
